[project]
name = "us-econ"
version = "0.1.0"
description = "Periodic collectors and forecasts for U.S. economic data, landing in BigQuery."
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pytrends>=4.9",
    # Forecast runtime deps — used by forecasts that ship in the same container
    # image as collectors (claims bucket_probs; bls_employment.production;
    # claims direction_lgbm, currently suspended).
    "pandas>=2.2",
    "numpy>=1.26",
    # Direct, not transitive: claims.bucket_probs needs scipy.stats.norm, whose
    # only other path into the image is via lightgbm/scikit-learn/statsmodels.
    # lightgbm exists solely for the suspended direction model, so a future
    # cleanup that drops it must not silently break the bucket forecast.
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "db-dtypes>=1.3",
    "statsmodels>=0.14",  # dynamic factor model in bls_employment.production
    "openpyxl>=3.1.5",  # parse the bundled R-CPI-NTR/ATR seed workbook (bls_ntr)
    "xlrd>=2.0.1",  # NAHB publishes the HMI history as legacy .xls (nahb_hmi)
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]
# Local-only exploration deps. Not shipped to the container.
forecast = [
    "pyarrow>=17",
    "xgboost>=2.1",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collectors*", "forecasts*"]

[tool.setuptools.package-data]
# Bundle seed workbooks into the image. bls.gov is bot-blocked and these are not
# in the BLS API, so there is no live fetch path -- the published xlsx are
# vendored and parsed by their collectors (see collectors/bls_ntr,
# collectors/bls_cpi_weights).
"collectors.bls_ntr" = ["data/*.xlsx"]
"collectors.bls_cpi_weights" = ["data/*.xlsx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
