[project]
name = "us-econ"
version = "0.1.0"
description = "Periodic collectors and forecasts for U.S. economic data, landing in BigQuery."
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pytrends>=4.9",
    # Forecast runtime deps — used by forecasts that ship in the same container
    # image as collectors (claims direction_lgbm; bls_employment.production).
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "db-dtypes>=1.3",
    "statsmodels>=0.14",  # dynamic factor model in bls_employment.production
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]
# Local-only exploration deps. Not shipped to the container.
forecast = [
    "pyarrow>=17",
    "xgboost>=2.1",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collectors*", "forecasts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
